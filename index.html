<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Səma — Dünyanın Ən Gözəl Qızının Albomu</title>
  <meta name="description" content="Dünyanın ən gözəl qızı Səma üçün hazırlanmış xüsusi albom. Onun gözəlliyi, işığı və sevinci burada." />
  <meta name="theme-color" content="#09030e" />

  <!-- Fonts: serif display, script, handwriting and UI sans (all with latin-ext for Azerbaijani glyphs) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Great+Vibes&family=Caveat:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap&subset=latin-ext" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="scene" id="scene">

    <!-- Layer 0: mahogany tabletop with directional spotlight -->
    <div class="table" aria-hidden="true">
      <div class="table__light"></div>
      <div class="table__vignette"></div>
    </div>

    <!-- Layer 1: prologue backdrop (fades away after intro) -->
    <div class="intro-backdrop" id="intro-backdrop" aria-hidden="true"></div>

    <!-- Layer 2: dust & golden bokeh particles -->
    <canvas class="particles" id="particles" aria-hidden="true"></canvas>

    <!-- Layer 3: the album -->
    <main class="stage-wrap" id="stage-wrap" aria-label="Səmanın albomu">
      <div class="book-stage" id="book-stage">
        <div class="book-shadow" aria-hidden="true"></div>
        <div class="page-stack page-stack--left" id="stack-left" aria-hidden="true"></div>
        <div class="page-stack page-stack--right" id="stack-right" aria-hidden="true"></div>
        <div class="ribbon" aria-hidden="true"></div>
        <div class="book" id="book"><!-- pages are generated by js/app.js --></div>
      </div>
    </main>

    <!-- Layer 4: PIN Lock Screen -->
    <section class="pin-lock" id="pin-lock">
      <div class="pin-lock__card">
        <div class="pin-lock__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path class="lock-shackle" d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h1 class="pin-lock__title">Səmanın Albomu</h1>
        <p class="pin-lock__hint">Açmaq üçün şifrəni daxil et 🔑</p>
        <div class="pin-lock__dots" id="pin-dots">
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
        </div>
        <p class="pin-lock__error" id="pin-error"></p>
        <div class="pin-lock__pad" id="pin-pad">
          <button class="pin-key" data-key="1">1</button>
          <button class="pin-key" data-key="2">2</button>
          <button class="pin-key" data-key="3">3</button>
          <button class="pin-key" data-key="4">4</button>
          <button class="pin-key" data-key="5">5</button>
          <button class="pin-key" data-key="6">6</button>
          <button class="pin-key" data-key="7">7</button>
          <button class="pin-key" data-key="8">8</button>
          <button class="pin-key" data-key="9">9</button>
          <button class="pin-key pin-key--fn" data-key="clear">Sil</button>
          <button class="pin-key" data-key="0">0</button>
          <button class="pin-key pin-key--fn" data-key="back">⌫</button>
        </div>
      </div>
    </section>

    <!-- Layer 5: True Finale Overlay -->
    <section class="true-finale" id="true-finale">
      <div class="true-finale__content">
        <div class="true-finale__emblem" aria-hidden="true">
          <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
            <circle cx="60" cy="60" r="56" stroke-width=".8" stroke-dasharray="1 4"/>
            <path d="M60 10l-6 14h12zM60 110l-6-14h12zM10 60l14-6v12zM110 60l-14-6v12z"/>
          </svg>
        </div>
        <p class="true-finale__text script">Nə olur olsun, səni sevməkdən, yanında olmaqdan vaz keçməyəcəm,<br>bir gün ürəyində olmaq ümidi ilə...</p>
        <div class="true-finale__divider" aria-hidden="true"><span></span>✦<span></span></div>
        <p class="true-finale__sign script">Sevgi ilə</p>
      </div>
    </section>

    <!-- Ambient audio toggle -->
    <button class="music-toggle glass" id="music-toggle" type="button" aria-pressed="false" aria-label="Fon musiqisini aç/bağla">
      <span class="music-toggle__icon" aria-hidden="true">
        <svg class="icon-note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <span class="eq"><i></i><i></i><i></i><i></i></span>
      </span>
      <span class="music-toggle__label">Musiqi 🎵</span>
    </button>

    <!-- Floating glass control bar -->
    <nav class="controls glass" id="controls" aria-label="Albom naviqasiyası">
      <button class="ctrl" id="btn-prev" type="button" aria-label="Əvvəlki səhifə">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="controls__counter" id="page-counter" aria-live="polite">Üz qabığı</div>
      <button class="ctrl" id="btn-next" type="button" aria-label="Növbəti səhifə">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <span class="controls__sep" aria-hidden="true"></span>
      <button class="ctrl ctrl--text" id="btn-restart" type="button" aria-label="Əvvələ qayıt">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        <span>Əvvələ qayıt</span>
      </button>
      <button class="ctrl" id="btn-fullscreen" type="button" aria-label="Tam ekran">
        <svg class="fs-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        <svg class="fs-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
      </button>
    </nav>
  </div>

  <!--
    Optional background music file.
    Put an mp3 in /assets (e.g. assets/music.mp3) and set CONFIG.musicUrl in js/data.js.
    If no URL is set (or it fails to load), a procedural Web Audio piano is used instead.
  -->
  <audio id="bg-music" loop preload="none"></audio>

  <!-- StPageFlip: realistic page physics -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
